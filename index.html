<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AirBox</title>
  <meta name="description"
    content="AirBox: una guía simple de box breathing (respiración cuadrada) al estilo Navy SEAL." />
  <meta name="theme-color" content="#0a1420" />

  <!-- Ubuntu -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Style -->
  <link href="css/style.css" rel="stylesheet" />  
</head>

<body>

  <!-- Contenido principal -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center px-3 py-4">
    <div class="airbox-card text-center">

      <h1 class="brand">Air<span>Box</span></h1>
      <p class="tagline">Respiración Cuadrada</p>

      <!-- Caja animada -->
      <div class="breath-wrap">
        <svg viewBox="0 0 300 300" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#a6e6dc" />
              <stop offset="55%" stop-color="#6ecfc4" />
              <stop offset="100%" stop-color="#b3a7ec" />
            </linearGradient>
          </defs>

          <!-- Recorrido base -->
          <path class="track" d="M 30 270 L 30 30 L 270 30 L 270 270 Z" />

          <!-- Recorrido que se va dibujando -->
          <path class="progress" id="progressPath" d="M 30 270 L 30 30 L 270 30 L 270 270 Z" />

          <!-- Punto que viaja por el cuadrado -->
          <circle class="dot-halo" id="dotHalo" cx="30" cy="270" r="13" />
          <circle class="dot" id="dot" cx="30" cy="270" r="6.5" />
        </svg>

        <div class="breath-center">
          <div class="phase" id="phase">inhala</div>
          <div class="count" id="count">4</div>
        </div>
      </div>

      <button type="button" class="btn btn-airbox" id="toggle">Pausar</button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    creado por
    <a href="https://mfslab.github.io/mfslab/" target="_blank" rel="noopener noreferrer">MFS Lab</a>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/breathe.js"></script>

</body>

</html>
